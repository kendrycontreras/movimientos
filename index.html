<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Movimientos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Esto le dice a Tailwind que use 'Outfit' como la fuente predeterminada
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Outfit', 'sans-serif'],
        },
      },
    },
  }
</script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen p-6">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-blue-600">Bienvenido</h2>
            <p class="text-gray-500 text-sm">Ingresa tus credenciales</p>
        </div>
        <div class="space-y-5">
            <input type="text" id="userInput" placeholder="Usuario" 
                   class="w-full p-4 border rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none shadow-sm">
            <input type="password" id="passInput" placeholder="Contraseña" 
                   class="w-full p-4 border rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none shadow-sm">
            <button onclick="intentarLogin()" 
                    class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all">
                Iniciar Sesión
            </button>
        </div>
        <p id="errorMsg" class="text-red-500 text-sm mt-5 hidden text-center font-bold">⚠️ Usuario o contraseña incorrectos</p>
    </div>
    <script src="auth.js"></script>
</body>
</html>
