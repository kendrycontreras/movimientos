<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Movimientos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Esto le dice a Tailwind que use 'Outfit' como la fuente predeterminada
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Outfit', 'sans-serif'],
        },
      },
    },
  }
</script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 pb-12">
    <header class="bg-blue-600 text-white p-5 sticky top-0 shadow-lg z-50 rounded-b-3xl">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-bold">Tus Movimientos</h1>
            <button onclick="cerrarSesion()" class="text-sm bg-red-500 px-3 py-1 rounded-full">Salir</button>
        </div>
        <input type="text" id="busqueda" placeholder="Buscar por nombre o banco..." 
               class="w-full p-4 rounded-2xl text-black shadow-inner outline-none text-sm">
    </header>

    <main id="lista-movimientos" class="p-4 space-y-4 mt-2">
    </main>
    <footer class="fixed bottom-0 left-0 w-full bg-white/80 backdrop-blur-md border-t border-gray-100 p-4 pb-8 shadow-[0_-5px_15px_rgba(0,0,0,0.05)] z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
        <div>
            <p class="text-[10px] uppercase tracking-widest text-gray-400 font-bold">Total General</p>
            <h2 id="total-bs" class="text-xl font-black text-gray-800 font-[Outfit]">0,00 Bs.</h2>
        </div>
        <div class="text-right">
            <p class="text-[10px] uppercase tracking-widest text-gray-400 font-bold">Total USD</p>
            <h2 id="total-usd" class="text-lg font-bold text-gray-500 font-[Outfit]">$0.00</h2>
        </div>
    </div>
</footer>

    <script src="auth.js"></script> <script src="app.js"></script>
</body>
</html>
